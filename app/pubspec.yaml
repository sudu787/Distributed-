name: syncsphere
description: >-
  SyncSphere — synchronized multi-phone music playback over a local network.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  sqflite: ^2.4.0
  path_provider: ^2.1.0
  file_picker: ^13.1.0
  path: ^1.9.0
  syncsphere_core:
    path: ../packages/syncsphere_core
  syncsphere_audio:
    path: ../packages/syncsphere_audio
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  xml: ^7.0.0
  # SQLite on Windows (bundled by the sqlite3 package's build hook).
  sqflite_common_ffi: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
